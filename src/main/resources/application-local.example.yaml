spring:
  ai:
    dashscope:
      api-key: your-dashscope-api-key
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      qdrant:
        host: your-qdrant-host
        port: 6334
        api-key: your-qdrant-api-key
        use-tls: true
        collection-name: customs_knowledge
        initialize-schema: true
